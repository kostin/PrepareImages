name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: PrepareImages-windows-x64
            package: PrepareImages-windows-x64.zip
          - name: macOS Apple Silicon
            os: macos-15
            artifact: PrepareImages-macos-arm64
            package: PrepareImages-macos-arm64.tar.gz
          - name: macOS Intel
            os: macos-15-intel
            artifact: PrepareImages-macos-x64
            package: PrepareImages-macos-x64.tar.gz
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Собрать один исполняемый файл
        run: python -m PyInstaller --clean --noconfirm PrepareImages.spec

      - name: Проверить собранный файл (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tests/smoke_test.py dist/prepare_images.exe

      - name: Проверить собранный файл (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/prepare_images
          file dist/prepare_images
          python tests/smoke_test.py dist/prepare_images

      - name: Упаковать (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/prepare_images.exe -DestinationPath "${{ matrix.package }}" -Force

      - name: Упаковать (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x dist/prepare_images
          tar -czf "${{ matrix.package }}" -C dist prepare_images
          ls -l "${{ matrix.package }}"

      - name: Выложить артефакт
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 90

  release:
    name: Релиз
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: PrepareImages-*
          merge-multiple: true

      - name: Показать файлы релиза
        run: ls -lR artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
